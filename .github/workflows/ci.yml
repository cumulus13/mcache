name: ci

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MsmqCache.sln

      - name: Build
        run: dotnet build MsmqCache.sln -c Release --no-restore

      # Unit tests + real TCP/RESP integration tests (loopback). MSMQ tests are skipped unless MSMQCACHE_MSMQ_TESTS=1.
      - name: Test
        run: dotnet test MsmqCache.sln -c Release --no-build --logger "trx;LogFileName=test.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore
