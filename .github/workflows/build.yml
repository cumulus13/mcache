name: build

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    needs: ci
    name: package (${{ matrix.rid }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,   mode: framework-dependent }
          - { os: windows-latest, rid: win-x64,   mode: self-contained }
          - { os: ubuntu-latest,  rid: linux-x64, mode: framework-dependent }
          - { os: ubuntu-latest,  rid: linux-x64, mode: self-contained }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Package
        shell: pwsh
        run: |
          $p = @{ Version = "1.0.0-ci.${{ github.run_number }}"; Rid = '${{ matrix.rid }}' }
          if ('${{ matrix.mode }}' -eq 'self-contained') { $p.SelfContained = $true }
          ./scripts/package.ps1 @p

      - uses: actions/upload-artifact@v4
        with:
          name: msmqcache-${{ matrix.rid }}-${{ matrix.mode }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256
          retention-days: 14
